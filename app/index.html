<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Central da Fábrica 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: ferramenta de trabalho, direta, divertida no acabamento e séria nos números
   IDEA: um sistema operacional Y2K / celular flip: janelas com barra azul "New Message", teclas rosa, adesivos cromados
   PICTURE: o próprio app; painel abre com números grandes em fonte pixel e um gráfico de barras de faturamento
   COLOUR and TYPE: céu azul de fundo, rosa chiclete dominante, amarelo marca-texto de acento; Pixelify Sans p/ títulos e números, Figtree p/ texto
   LAYOUT: menu lateral rosa (gaveta no celular), conteúdo em janelas com sombra rosa dura */
:root{color-scheme:light dark;
--bg:light-dark(#bfe1ff,#0c0f2e);--bg2:light-dark(#e9f5ff,#151a45);--paper:light-dark(#ffffff,#1a1f4d);--ink:light-dark(#1b1033,#f4f0ff);
--mut:light-dark(#5d5080,#b9b2dd);--line:light-dark(#1b1033,#7d77c4);--soft:light-dark(#efe9ff,#242a63);
--pink:#ff4fb3;--pinkd:light-dark(#d81b8c,#ff7cc9);--pinks:light-dark(#ffe0f2,#4b1a49);--yel:#ffe62e;--yels:light-dark(#fff8bf,#4a4213);
--blue:#2f6bff;--blues:light-dark(#dce9ff,#1f2b6e);--ok:light-dark(#0e8a57,#4ee2a0);--oks:light-dark(#d8f7e8,#123c2d);--bad:light-dark(#d2213f,#ff7389);--bads:light-dark(#ffe0e5,#4d1520);--warn:light-dark(#a36200,#ffc24d);--warns:light-dark(#fff0cc,#4a3510)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px}
body{margin:0;background:radial-gradient(ellipse 40% 18% at 85% 6%,light-dark(#fff,#20265e) 0,transparent 70%),radial-gradient(ellipse 30% 14% at 30% 0,light-dark(#ffffffcc,#1c2257) 0,transparent 70%),linear-gradient(180deg,var(--bg),var(--bg2) 60%);background-attachment:fixed;color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif;overflow-x:clip;min-height:100vh}
h1,h2,h3,.px{font-family:"Pixelify Sans",Figtree,monospace;font-weight:700;letter-spacing:.01em}
h1{font-size:clamp(28px,4vw,40px);line-height:1.05;margin:0;text-wrap:balance}
h2{font-size:22px;margin:0 0 10px}
a{color:var(--pinkd)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:linear-gradient(180deg,#ff6cc0,#ff4fb3 40%,#f23ea4);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;border-right:3px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.logo svg{width:38px;height:38px;flex:none}
.logo b{font:700 19px/1.05 "Pixelify Sans",monospace}
.logo small{display:block;font:600 12px Figtree;opacity:.9}
.nav{display:grid;gap:6px}
.nav a{display:flex;align-items:center;gap:10px;min-height:42px;padding:8px 12px;border-radius:12px;color:#fff;text-decoration:none;font-weight:600;background:#ffffff1f;border:2px solid transparent}
.nav a:hover{background:#ffffff38}
.nav a.on{background:#fff;color:#c2127a;border-color:var(--line);box-shadow:3px 3px 0 #1b1033}
.nav i{font-style:normal;font:700 13px "Pixelify Sans";width:22px;height:22px;display:grid;place-items:center;border-radius:6px;background:#ffffff40;flex:none}
.nav a.on i{background:var(--yel);color:#1b1033}
.me{margin-top:16px;padding:10px 12px;border-radius:12px;background:#0000001f;font-size:13px}
.me b{display:block;font-size:15px}
.main{padding:18px clamp(14px,3vw,36px) 60px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top h1{flex:1 1 150px}
.menu{display:none}
.bell{position:relative}
.bell .c{position:absolute;top:-6px;right:-6px;background:var(--yel);color:#1b1033;border:2px solid var(--line);border-radius:99px;font:700 12px "Pixelify Sans";min-width:22px;height:22px;display:grid;place-items:center;padding:0 4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 16px;border-radius:12px;border:2px solid var(--line);background:var(--pink);color:#fff;font-weight:800;cursor:pointer;box-shadow:3px 3px 0 var(--line);white-space:nowrap}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--line)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn.yel{background:var(--yel);color:#1b1033}
.btn.sm{min-height:36px;padding:4px 10px;font-size:14px;border-radius:10px;box-shadow:2px 2px 0 var(--line)}
.btn.bad{background:var(--bads);color:var(--bad)}
.btn[disabled]{opacity:.5;pointer-events:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.win{background:var(--paper);border:2px solid var(--line);border-radius:16px;box-shadow:6px 6px 0 var(--pink);overflow:hidden;margin-bottom:22px}
.tb{display:flex;align-items:center;gap:10px;padding:8px 14px;background:linear-gradient(180deg,#6aa3ff,#2f6bff);color:#fff;border-bottom:2px solid var(--line);font:700 17px "Pixelify Sans",monospace}
.tb b{flex:1;font-weight:700}
.tb .dots{display:flex;gap:5px}.tb .dots span{width:11px;height:11px;border:2px solid #fff;border-radius:3px}
.wb{padding:16px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,195px),1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:4px 4px 0 var(--line)}
.kpi span{font-size:13px;color:var(--mut);font-weight:600;display:block}
.kpi b{font:700 clamp(20px,2.2vw,28px)/1.1 "Pixelify Sans",monospace;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi small{font-size:13px;color:var(--mut)}
.kpi.hot{background:var(--yel);color:#1b1033}.kpi.hot span,.kpi.hot small{color:#4a3a00}
.kpi.pk{background:var(--pinks)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs a{padding:8px 14px;border-radius:99px;border:2px solid var(--line);background:var(--paper);text-decoration:none;color:var(--ink);font-weight:700;min-height:40px;display:inline-flex;align-items:center}
.tabs a.on{background:var(--yel);color:#1b1033;box-shadow:2px 2px 0 var(--line)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
.bar .fl{flex:1 1 160px;margin:0}
.fl{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.fl span{font-size:14px;font-weight:700}
.fl small{font-size:13px;color:var(--mut)}
input,select,textarea{width:100%;min-height:44px;padding:9px 12px;border:2px solid var(--line);border-radius:10px;background:var(--paper);font-size:16px}
textarea{min-height:80px;resize:vertical}
input[type=color]{padding:3px;width:56px}
.chk{display:flex;align-items:center;gap:8px;min-height:40px;font-weight:600;cursor:pointer}
.chk input{width:22px;min-height:22px;height:22px;accent-color:var(--pink)}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:0 14px}
.fg .w2{grid-column:span 2}.fg .wf{grid-column:1/-1}
@media(max-width:560px){.fg .w2{grid-column:1/-1}}
fieldset{border:2px dashed var(--line);border-radius:14px;padding:12px 14px 4px;margin:0 0 14px}
legend{font:700 16px "Pixelify Sans";padding:0 6px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:13px;color:var(--mut);font-weight:700;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--soft);vertical-align:top}
.r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.ck{cursor:pointer}tr.ck:hover td{background:var(--pinks)}
tfoot td{font-weight:800;border-top:2px solid var(--line)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700;border:1.5px solid currentColor;white-space:nowrap}
.p-ok{color:var(--ok);background:var(--oks)}.p-bad{color:var(--bad);background:var(--bads)}.p-warn{color:var(--warn);background:var(--warns)}.p-blue{color:var(--blue);background:var(--blues)}.p-pink{color:var(--pinkd);background:var(--pinks)}.p-mut{color:var(--mut);background:var(--soft)}
.empty{padding:22px;text-align:center;color:var(--mut);border:2px dashed var(--soft);border-radius:12px}
.muted{color:var(--mut)}.small{font-size:13px}
.hbar{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) auto;gap:8px;align-items:center;margin:6px 0;font-size:14px}
.hbar>div{height:16px;background:var(--soft);border-radius:6px;overflow:hidden;border:1.5px solid var(--line)}
.hbar>div i{display:block;height:100%;background:var(--pink)}
.cols{display:flex;align-items:flex-end;gap:3px;height:150px;padding-top:10px;border-bottom:2px solid var(--line)}
.cols div{flex:1;background:var(--pink);border:1.5px solid var(--line);border-bottom:0;border-radius:4px 4px 0 0;min-height:2px;position:relative}
.cols div:hover{background:var(--yel)}
.cols div:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);font-size:12px;padding:2px 6px;border-radius:6px;white-space:nowrap;margin-bottom:4px;z-index:2}
.axis{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:14px}
.card{background:var(--paper);border:2px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;box-shadow:4px 4px 0 var(--line);display:flex;flex-direction:column}
.card:hover{box-shadow:5px 5px 0 var(--pink)}
.ph{aspect-ratio:4/3;background:repeating-linear-gradient(45deg,var(--pinks) 0 12px,var(--paper) 12px 24px);display:grid;place-items:center;border-bottom:2px solid var(--line);font:700 34px "Pixelify Sans";color:var(--pinkd)}
.ph img{width:100%;height:100%;object-fit:cover}
.card .cb{padding:10px 12px;display:grid;gap:4px}
.card .cb b{font-size:16px;line-height:1.2}
.dots2{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0;box-shadow:inset -3px -3px 0 #0002,inset 2px 2px 0 #fff8}
.dot.on{outline:3px solid var(--pink);outline-offset:2px}
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x mandatory}
.kc{background:var(--soft);border:2px solid var(--line);border-radius:14px;padding:10px;scroll-snap-align:start;min-height:120px}
.kc h3{font-size:15px;margin:0 0 8px;display:flex;justify-content:space-between}
.op{background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;cursor:pointer;font-size:14px;box-shadow:2px 2px 0 var(--line)}
.op b{display:block}
.list{display:grid;gap:8px}
.li{display:flex;gap:10px;align-items:center;padding:10px 12px;border:2px solid var(--soft);border-radius:12px;background:var(--paper)}
.li>div{flex:1}
.li.ck{cursor:pointer}.li.ck:hover{border-color:var(--pink)}
.sw{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);display:inline-block;vertical-align:-3px;margin-right:6px}
.bomr{display:grid;grid-template-columns:minmax(0,1fr) 110px 44px;gap:8px;margin-bottom:8px;align-items:center}
.bomr .u{grid-column:1/-1;font-size:13px;color:var(--mut);margin-top:-6px}
.costs{background:var(--yels);border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px}
.costs .row{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.costs .row.t{font-weight:800;border-top:2px solid var(--line);margin-top:4px;padding-top:6px;font-size:16px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs div{position:relative}
.thumbs img{width:80px;height:80px;object-fit:cover;border-radius:10px;border:2px solid var(--line)}
.thumbs button{position:absolute;top:-6px;right:-6px;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--paper);cursor:pointer}
#modal{position:fixed;inset:0;background:#1b103399;display:grid;place-items:start center;padding:4vh 12px;overflow-y:auto;z-index:50}
#modal[hidden]{display:none}
.mwin{width:min(620px,100%);background:var(--paper);border:2px solid var(--line);border-radius:16px;box-shadow:8px 8px 0 var(--pink);overflow:hidden;margin-bottom:6vh}
.mwin.wide{width:min(980px,100%)}
.mwin form{padding:16px}
.tb .x{background:#fff;color:#1b1033;border:2px solid var(--line);border-radius:8px;width:34px;height:34px;font-size:20px;cursor:pointer;line-height:1}
.mact{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px;position:sticky;bottom:0;background:var(--paper);padding-top:10px}
.err{color:var(--bad);font-weight:700;min-height:1px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:12px;font-weight:700;z-index:60;max-width:90vw}
#toast[hidden]{display:none}
#toast{display:flex;align-items:center}
[data-sw]{touch-action:pan-y;transition:transform .18s}
.swiping{transition:none!important;position:relative;z-index:3;box-shadow:0 0 0 3px var(--bad)!important}
.swarm,.swarm td{background:var(--bads)!important}
#notif{position:fixed;right:16px;top:16px;max-width:min(360px,90vw);background:var(--paper);border:2px solid var(--line);border-left:10px solid var(--pink);border-radius:14px;box-shadow:5px 5px 0 var(--line);padding:10px 14px;z-index:80;cursor:pointer;display:grid;gap:2px}
#notif[hidden]{display:none}
#notif span{font-size:14px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.nav a .c{margin-left:auto;background:var(--yel);color:#1b1033;border:2px solid #1b1033;border-radius:99px;font:700 12px "Pixelify Sans";min-width:22px;height:22px;display:grid;place-items:center;padding:0 5px}
#swhint{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--bad);color:#fff;font-weight:800;padding:8px 16px;border-radius:12px;border:2px solid var(--line);z-index:70;pointer-events:none}
#swhint[hidden]{display:none}
.gate{max-width:560px;margin:12vh auto;padding:0 16px}
.note{background:var(--blues);border:2px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:14px}
.steps{counter-reset:s;display:grid;gap:8px;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;position:relative;padding-left:40px;min-height:30px;padding-top:3px}
.steps li::before{position:absolute;left:0;top:0;content:counter(s);font:700 15px "Pixelify Sans";width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;background:var(--paper);flex:none}
.steps li.done::before{content:"✓";background:var(--yel);color:#1b1033}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
pre,.scroll{overflow-x:auto}.scroll a{flex:none}
code{overflow-wrap:anywhere}
.stars{position:fixed;right:18px;bottom:16px;width:90px;opacity:.9;pointer-events:none;z-index:0}
#chatbox{height:min(60vh,560px);overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px 10px}
.msg{max-width:78%;padding:8px 12px;border:2px solid var(--line);border-radius:14px 14px 14px 4px;background:var(--paper);box-shadow:2px 2px 0 var(--line);overflow-wrap:anywhere;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--pinks);border-radius:14px 14px 4px 14px}
.msg small{display:block;font-size:12px;color:var(--mut);white-space:normal}
.day{align-self:center;font-size:12px;color:var(--mut);background:var(--soft);border-radius:99px;padding:2px 10px}
.chatin{display:flex;gap:8px;align-items:flex-end;border-top:2px solid var(--soft);padding-top:10px}
.chatin textarea{min-height:48px;height:48px;flex:1}
.help h3{font-size:18px;margin:14px 0 4px}.help p,.help li{max-width:70ch}
@media(max-width:900px){
 .app{grid-template-columns:minmax(0,1fr)}
 .side{position:fixed;inset:0 auto 0 0;width:min(290px,86vw);z-index:40;transform:translateX(-105%);transition:transform .2s}
 .app.open .side{transform:none}
 .app.open::after{content:"";position:fixed;inset:0;background:#1b103366;z-index:30}
 .menu{display:inline-flex}
 .stars{display:none}
}
@media(max-width:600px){table{font-size:14px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--soft)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mut);font-size:13px;font-weight:700}.stack td:empty{display:none}.win .wb{padding:12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.btn:hover,.btn:active{transform:none}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>

 <defs><radialGradient id="chr" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#d9d9e8"/><stop offset=".75" stop-color="#8e8ea8"/><stop offset="1" stop-color="#f4f4ff"/></radialGradient></defs>
 <symbol id="star" viewBox="0 0 100 100"><path d="M50 4 62 36 96 38 69 59 79 94 50 74 21 94 31 59 4 38 38 36Z" fill="url(#chr)" stroke="#1b1033" stroke-width="4" stroke-linejoin="round"/><path d="M40 30 48 14" stroke="#fff" stroke-width="5" stroke-linecap="round"/></symbol>

<script>
{
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{if(typeof v==='number')return isFinite(v)?v:0;let t=String(v??'').replace(/\s|R\$/g,'');if(t.includes(','))t=t.replace(/\./g,'').replace(',','.');else if(/^-?[1-9]\d{0,2}(\.\d{3})+$/.test(t))t=t.replace(/\./g,'');const n=parseFloat(t);return isFinite(n)?n:0};
const rd=(v,d=3)=>Math.round(v*10**d)/10**d;
const brl=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const n2=(v,d=0)=>(+v||0).toLocaleString('pt-BR',{maximumFractionDigits:d});
const pct=v=>n2((v||0)*100,1)+'%';
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const now=()=>new Date().toISOString();
const addD=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const fdt=s=>s?new Date(String(s).length<=10?s+'T12:00':s).toLocaleDateString('pt-BR'):'—';
const fdth=s=>s?new Date(s).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'—';
const hm=min=>{min=Math.round(+min||0);return (min>=60?Math.floor(min/60)+'h ':'')+(min%60)+'min'};
const sum=(a,f)=>a.reduce((s,x)=>s+(+f(x)||0),0);

function prodCost(p,depth=0){const c=cfg();let mat=0,comp=0,emb=0,gramas=0,prods=0;
 (p.bom||[]).forEach(r=>{const q=num(r.q);if(r.t==='p'){const x=G('produtos',r.id);if(x&&depth<4){prods+=prodCost(x,depth+1).total*q}}else{const m=G('materiais',r.id);if(!m)return;const v=num(m.custoUnit)*q;if(m.tipo==='filamento'){mat+=v;gramas+=q}else if(m.tipo==='embalagem')emb+=v;else comp+=v}});
 const I=L('impressoras'),ppi=Math.max(1,num(p.pecasImp)||1),hImp=num(p.tempoImpMin)/60/ppi,imp=G('impressoras',p.impressoraId)||(I.length===1?I[0]:{potenciaW:c.impPot,valor:c.impValor,vidaUtilH:c.impVida,manutH:c.impManut});
 const energia=hImp*num(imp.potenciaW||120)/1000*num(c.kwh);
 const deprec=hImp*(num(imp.valor)/Math.max(1,num(imp.vidaUtilH)||5000)+num(imp.manutH));
 const mao=num(p.maoObraMin)/60*num(c.maoObraHora);
 const perdas=mat*num(c.perdas)/100;
 const extra=num(p.custoManual),total=mat+comp+emb+prods+energia+deprec+mao+perdas+extra;
 return{mat,comp,emb,prods,energia,deprec,mao,perdas,total,gramas,hImp}}
function pricing(p,preco,canal){const c=cfg(),k=prodCost(p),ch=(c.canais||[]).find(x=>x.n===canal);
 const varPct=num(c.marketing)/100,fr=num(c.freteSub),pv=preco??num(p.preco);
 const mg=p.margem!=null&&p.margem!==''?num(p.margem):num(c.margemAlvo),desp=pv*varPct+fr,mc=pv-k.total-desp,sug=(k.total+fr)/Math.max(.05,1-varPct-mg/100);
 return{...k,varPct,desp,pv,mc,mcPct:pv?mc/pv:0,sug,mg,lucroSug:sug-k.total-sug*varPct-fr,pe:mc>0?num(c.fixosMes)/mc:Infinity}}
const estP=p=>{const e=p.est||{};return{pronto:num(e.pronto),res:num(e.reservado),disp:num(e.pronto)-num(e.reservado),def:num(e.defeito),expo:num(e.expo)}};
const pn=p=>p?p.nome+(p.corNome?' · '+p.corNome:''):'';const itN=i=>pn(G('produtos',i.pid))||i.nome||'';const itK=i=>i.pid||'~'+(i.nome||'');
const gk=p=>p.grupo||p.id;
const corDe=p=>{if(/^#[0-9a-f]{6}$/i.test(p.corHex||''))return p.corHex;const r=(p.bom||[]).find(r=>r.t!=='p'&&G('materiais',r.id)?.tipo==='filamento');const h=r&&G('materiais',r.id).hex;return/^#[0-9a-f]{6}$/i.test(h||'')?h:'#cccccc'};

/* ---------- AJUDA ---------- */
V.ajuda=()=>{const sec=[
['o-que-e','O que é este sistema',`<p>É a central da fábrica: um lugar só onde a equipe controla tudo, do rolo de filamento até a peça vendida, enviada e o lucro de verdade. O que alguém mexe aparece na hora para todo mundo.</p><p>Nada vem preenchido: todo número foi a equipe que colocou. Cada mudança fica gravada com quem fez e quando.</p>`],
['comecar','Por onde começar',`<ol class="steps"><li><b>Custos e preços</b> — mão de obra por hora, energia e os dados da sua impressora (potência e quanto custou). Faz uma vez só.</li><li><b>Estoque e matéria-prima</b> — cadastre tudo que tem em casa: cada filamento (material, marca, cor), ímãs, caixas, adesivos. Rolo de filamento já vem com 1000 g; só coloque o preço pago.</li><li><b>Produtos</b> — dê o nome, a coleção, escolha as cores já cadastradas e quantos gramas vão em cada peça, e o tempo de impressão. O sistema calcula o custo e sugere o preço pelo lucro que você quiser.</li><li><b>Produzi</b> — fez peças? Clique em Produzi no produto: desconta os materiais e soma as peças prontas (igual à fornada do biscoito).</li><li><b>Pedidos</b> — registre a venda. Se não tiver peça pronta, ele já oferece mandar para a Produção.</li></ol>`],
['login','Login, senha e chat',`<p>Cada pessoa entra com o próprio usuário e senha. No primeiro acesso a pessoa cria os dela. A senha fica criptografada — ninguém vê, nem quem administra. <b>Minha senha</b> troca, <b>Sair</b> fecha a sessão. Esqueceu? Um administrador clica em <b>Redefinir senha</b> em Equipe.</p><p>O <b>Chat da equipe</b> é uma conversa única para todo mundo. Mensagem nova aparece com aviso, som e número no menu. Dá para <b>silenciar</b> no próprio chat e, se quiser, permitir avisos do navegador mesmo com o app em outra aba.</p>`],
['estoque','Estoque e matéria-prima',`<ul><li><b>+ Novo material</b>: tipo, material, marca, cor, quanto vem (escolha <b>kg</b> ou <b>g</b> — 1 rolo = 1 kg), quanto pagou e <b>quem pagou</b>. O custo por grama sai sozinho e o valor entra no investimento da pessoa.</li><li>Comprou mais um rolo da mesma cor? <b>Movimentar → Entrada</b>, 1 kg, o preço e quem pagou: o custo vira a média das compras.</li><li>Filamento abaixo de <b>200 g</b> fica vermelho, aparece em Alertas e dispara um aviso.</li><li>No topo do Estoque você vê quanto cada pessoa já investiu.</li><li><b>Produtos acabados</b>: peças prontas, reservadas para pedidos e disponíveis.</li><li><b>Inventário</b>: pesou os rolos? Digite o que tem de verdade e o sistema corrige.</li></ul>`],
['produtos','Produtos',`<ul><li>Preencha nome, coleção, dimensões, peso e descrição.</li><li><b>Cores</b>: o mesmo produto em várias cores fica num card só, com bolinhas. Abra o produto e clique em <b>+ outra cor</b>: ele copia tudo e você só troca o filamento (o custo muda sozinho) e a foto. Nome, coleção e tempo ficam iguais em todas as cores.</li><li><b>Materiais por peça</b>: uma linha por cor — ex.: PLA rosa 120 g + PLA branco 30 g + 2 ímãs + 1 caixa. Faltou uma cor? <b>+ cadastrar filamento</b> ali mesmo.</li><li><b>Impressão</b>: horas e minutos de impressão e quantas peças saem por mesa.</li><li><b>Custo e preço</b>: diga quanto de lucro quer (%) e o sistema sugere o preço. Clique em <b>usar</b> ou digite o seu. Pode deixar o preço vazio e decidir depois.</li><li><b>Kits</b>: junte produtos prontos + embalagem e use <b>Montar kits</b>.</li></ul>`],
['pedidos','Pedidos e produção',`<ul><li>Ao confirmar um pedido, o sistema reserva o que já está pronto. Se faltar, oferece criar a <b>ordem de produção</b>.</li><li>Em <b>Produção 3D</b> você vê o que precisa imprimir para os pedidos, na ordem: aguardando → na fila → imprimindo → acabamento → qualidade.</li><li><b>Concluir e inspecionar</b>: informa o filamento gasto de verdade e quantas peças ficaram boas. Só aí o estoque é descontado e as peças vão para o pedido.</li><li>Falhou uma impressão? <b>Registrar falha</b> com o motivo e os gramas perdidos.</li></ul>`],
['logistica','Logística',`<p>Pedido com tudo pronto aparece em <b>Aguardando embalagem</b>. Marque separado e conferido → embalado → enviado (transportadora, rastreio, frete). No envio as peças saem do estoque.</p>`],
['dinheiro','Compras, financeiro e acerto de contas',`<ul><li><b>Compras</b>: fornecedor, data, itens, frete e <b>quem pagou</b> (o caixa da empresa ou alguém do próprio bolso). <b>Confirmar recebimento</b> soma no estoque.</li><li>Vendas e fretes entram sozinhos no financeiro. Outras despesas (energia, internet, anúncios) você lança em <b>+ Lançamento</b>.</li><li><b>Acerto de contas</b>: mostra quanto cada pessoa colocou do bolso, quanto já foi devolvido e quanto falta. Primeiro devolve, depois divide o lucro — os botões já criam o lançamento certo.</li><li>Só quem é Editor vê o financeiro.</li></ul>`],
['marketing','Posts e tarefas',`<ul><li><b>Posts</b> é um quadro igual ao Trello: colunas Ideias → Produzindo → Aprovação → Agendado → Postado. Cada cartão tem rede, formato, data, legenda, checklist, imagens e comentários. Arraste no computador ou use ◀ ▶ no celular. A aba Calendário mostra o que sai em cada dia.</li><li><b>Tarefas e metas</b>: organize por área (marketing, financeiro, produção…), com responsável, prazo e prioridade.</li><li>Colunas, redes, formatos e áreas dá para mudar em Configurações.</li></ul>`],
['relatorios','Relatórios e qualidade',`<p><b>Relatórios</b>: filtre por período, coleção, canal ou pessoa e baixe em CSV ou Excel — vendas, lucro por produto, filamento gasto por cor, falhas e estoque parado. <b>Qualidade</b> mostra o que mais dá defeito.</p>`],
['palavras','Palavras que aparecem',`<ul><li><b>Custo da peça</b>: filamento + outros materiais + energia + desgaste da impressora + mão de obra + perdas.</li><li><b>Lucro por peça</b>: preço − custo − marketing.</li><li><b>Ponto de equilíbrio</b>: quantas peças vender por mês para pagar os custos fixos.</li><li><b>Reservado</b>: peça pronta já prometida a um pedido. <b>OP</b>: ordem de produção.</li></ul>`],
['backup','Segurança e backup',`<p>Se duas pessoas mexerem no mesmo item ao mesmo tempo, o sistema faz uma esperar a outra terminar — nenhuma conta se perde.</p><p>Em <b>Configurações → Baixar backup</b> você guarda uma cópia de tudo. Excluir não apaga de verdade: sai das listas e continua na auditoria.</p>`]];
 return`<div class="scroll flex" style="flex-wrap:nowrap;margin-bottom:16px">${sec.map(s=>`<a class="btn sm ghost" href="#ajuda" data-act="goSec" data-s="${s[0]}">${s[1]}</a>`).join('')}</div><div class="help">${sec.map(s=>`<div id="h-${s[0]}">${win(s[1],s[2])}</div>`).join('')}</div>`};

window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(MODS.some(m=>m[0]===h)){S.route=h;$('#app')?.classList.remove('open');render();scrollTo(0,0)}});
const normT=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
function catModal(j){const M=(j.modelos||[]).filter(m=>m&&m.nome&&(m.variacoes||[]).length),ja=new Set(L('produtos').map(p=>normT(p.nome)));
 const cores=[...new Set(M.flatMap(m=>m.variacoes.flatMap(v=>(v.placas||[]).flatMap(pl=>(pl.f||[]).map(f=>f[0])))))],fils=L('materiais').filter(m=>m.tipo==='filamento'),falta=cores.filter(c=>!fils.some(m=>normT(m.cor)===normT(c)));
 modal('Importar modelos',`<p>${M.length} modelo(s) no arquivo.</p><div class="list">${M.map(m=>`<div class="li"><span class="pill ${ja.has(normT(m.nome))?'p-warn':'p-ok'}">${ja.has(normT(m.nome))?'já existe':'novo'}</span><div><b>${esc(m.nome)}</b><div class="small muted">${m.variacoes.map(v=>esc(v.corNome||'')).join(' · ')} · ${m.variacoes[0].placas.length} placa(s) · ${hm(sum(m.variacoes[0].placas,x=>x.min))} · ${n2(sum(m.variacoes[0].placas,x=>sum(x.f,f=>f[1])),0)} g</div></div></div>`).join('')}</div>${falta.length?`<p class="note small">Filamentos que ainda não existem no estoque e vão ser criados com 0 g e sem preço (depois é só lançar a compra): <b>${esc(falta.join(', '))}</b></p>`:''}<p class="small muted">Modelos que já existem (mesmo nome) são pulados. O preço fica vazio: o sistema sugere pelo custo.</p>`,
 ()=>catRun(j),{ok:'Importar'})}
async function catRun(j,base){const cores=[...new Set((j.modelos||[]).flatMap(m=>(m.variacoes||[]).flatMap(v=>(v.placas||[]).flatMap(pl=>(pl.f||[]).map(f=>f[0])))))],M=(j.modelos||[]).filter(m=>m&&m.nome&&(m.variacoes||[]).length);const fid={};for(const c of cores){const m=L('materiais').find(m=>m.tipo==='filamento'&&normT(m.cor)===normT(c));fid[c]=m?m.id:await save('materiais',null,{tipo:'filamento',nome:'PLA',marca:'',material:'',cor:c,hex:/^#[0-9a-f]{6}$/i.test((j.cores||{})[c]||'')?j.cores[c]:'#cccccc',unidade:'g',estoque:0,custoUnit:0,precos:[]},'importou filamento')}
  let n=0;for(const m of M){if(L('produtos').some(p=>normT(p.nome)===normT(m.nome)))continue;let foto=[];
   if(m.foto&&S.assets){try{let bl;if(/^data:image\//.test(m.foto)){const[h,b64]=m.foto.split(','),bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);bl=new Blob([u],{type:h.slice(5,h.indexOf(';'))})}else if(/^[a-z0-9._-]+\.jpg$/.test(m.foto)&&base){const r=await fetch(base+m.foto,{cache:'no-store'});if(r.ok)bl=await r.blob()}if(bl){const r=await S.assets.upload(bl);foto=[r.id]}}catch(e){}}
   let g=null;for(const v of m.variacoes){const placas=(v.placas||[]).map((pl,i)=>({n:pl.n||'Placa '+(i+1),min:num(pl.min),f:(pl.f||[]).map(f=>({id:fid[f[0]],g:num(f[1])}))})),ag={};placas.forEach(pl=>pl.f.forEach(f=>ag[f.id]=(ag[f.id]||0)+f.g));
    const d={nome:m.nome,sku:'',tipo:'produto',categoria:m.categoria||'',colecao:m.colecao||'',descricao:m.descricao||'',custoManual:0,corNome:v.corNome||'',corHex:/^#[0-9a-f]{6}$/i.test(v.corHex||'')?v.corHex:'',preco:0,margem:'',dimensoes:'',peso:0,arquivo:'',versao:'',impressoraId:'',perfil:'',pecasImp:1,maoObraMin:0,acabamento:false,montagem:false,obsFicha:m.autor?'Modelo de '+m.autor:'',placas,tempoImpMin:sum(placas,x=>x.min),bom:Object.entries(ag).map(([id,q])=>({t:'m',id,q:rd(q,2)})),fotos:foto,status:'Ativo',est:{pronto:0,reservado:0,defeito:0,expo:0}};
    if(g)d.grupo=g;const id=await save('produtos',null,d,'importou modelo');if(!g){g=id;if(m.variacoes.length>1)await save('produtos',id,{grupo:id},'agrupou cores')}}n++}
  toast(n+' modelo(s) importado(s)');return n}
async function catAuto(){if(!window.HOSTED||!S.admin||cfg().catalogoV>=1||S.catRun)return;S.catRun=1;try{const r=await fetch('catalogo/modelos.json',{cache:'no-store'});if(!r.ok)return;const j=await r.json();toast('Cadastrando o catálogo de modelos… deixe a página aberta');await save('config','geral',{catalogoV:1},'catálogo automático');await catRun(j,'catalogo/fotos/')}catch(e){console.error(e)}}
async function shrink(file){const img=await createImageBitmap(file),k=Math.min(1,1400/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,'image/jpeg',.85))}

/* ---------- boot ---------- */
async function loadNames(){if(!S.user?.profiles)return;try{const ids=[...new Set([...S.d.membros.map(m=>m.id),...S.d.pedidosacesso.map(x=>x.id),S.uid])];const ps=await S.user.profiles(ids);ids.forEach(id=>{if(ps?.[id]?.name)S.names[id]=ps[id].name});schedule()}catch(e){}}
const auditSubs={};function subAudit(){const ids=S.admin?L('membros').map(m=>m.id):[S.uid];ids.forEach(id=>{if(auditSubs[id])return;auditSubs[id]=S.db.collection('audit/'+id+'/e').orderBy('em','desc').limit(150).onSnapshot(s=>{S.audit[id]=s.docs.map(d=>({id:d.id,...d.data()}));schedule()},()=>{})})}
async function decide(){const me=G('membros',S.uid);
 if(!me||me.excluido){if(S.owner&&!me){try{await S.db.collection('membros').doc(S.uid).set({roles:['admin'],cargo:'Fundadora',ativo:true,extra:[],bloq:[],criadoEm:now(),criadoPor:S.uid});return}catch(e){}}gate('pend',S.pediu?'<p class="note">Pedido enviado! Assim que a administradora aprovar, é só recarregar esta página.</p>':'<button class="btn" data-act="pedirAcesso" style="width:100%">Pedir acesso</button>');S.boot=false;return}
 if(me.ativo===false){gate('off2');S.boot=false;return}
 S.me=me;if(!S.boot){S.boot=true;S.seenBoot=S.seenBoot||now();if(window.HOSTED&&S.admin){checaPendentes();setInterval(checaPendentes,45000);setTimeout(catAuto,3000)}if(location.hash.slice(1)&&MODS.some(m=>m[0]===location.hash.slice(1)))S.route=location.hash.slice(1);
  if(!unlocked()){S.boot=false;if(!$('#loginf'))loginScreen();return}
  try{const ref=S.db.doc('acessos/'+S.uid),cur=await ref.get(),lista=[now(),...((cur.exists&&cur.data().lista)||[])].slice(0,30);await ref.set({ultimo:now(),lista})}catch(e){}}
 subAudit();loadNames();schedule()}
/* ---------- login ---------- */
const SK=()=>'c3d_ok_'+S.uid;
function unlocked(){if(window.HOSTED)return true;if(S.ok)return true;try{return sessionStorage.getItem(SK())==='1'}catch(e){return false}}
function setUnlocked(v){S.ok=v;try{v?sessionStorage.setItem(SK(),'1'):sessionStorage.removeItem(SK())}catch(e){}}
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function hashPw(pw,salt,it=150000){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return hex(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:new TextEncoder().encode(salt),iterations:it},k,256))}
async function newCred(user,pw){const salt=hex(crypto.getRandomValues(new Uint8Array(16)));return{user:user.trim().toLowerCase(),salt,it:150000,hash:await hashPw(pw,salt),em:now()}}
function pwRule(pw){if(String(pw).length<8)return'A senha precisa ter pelo menos 8 caracteres.';if(!/\d/.test(pw)||!/[a-zA-Z]/.test(pw))return'Use letras e números na senha.';return''}
async function loginScreen(){const c=cfg();let cred=null;try{const d=await S.db.doc('cred/'+S.uid).get();cred=d.exists?d.data():null}catch(e){}
 const first=!cred;$('#root').innerHTML=`<div class="gate" style="margin-top:8vh;max-width:440px"><div style="text-align:center;margin-bottom:14px"><svg style="width:64px;height:64px"><use href="#star"/></svg><h1 style="margin-top:6px">${esc(c.nome)}</h1><p class="muted" style="margin:4px 0 0">gestão interna</p></div><div class="win"><div class="tb"><b>${first?'Criar meu acesso':'Entrar'}</b><span class="dots"><span></span><span></span><span></span></span></div><div class="wb"><form id="loginf" novalidate>
 ${first?`<p class="small">Primeiro acesso${S.names[S.uid]?` de <b>${esc(S.names[S.uid])}</b>`:''}. Escolha seu usuário e uma senha — ela é guardada criptografada, nem a administradora consegue ver.</p>`:`<p class="small">Olá${S.names[S.uid]?`, <b>${esc(S.names[S.uid])}</b>`:''}!</p>`}
 ${F('Usuário','u',first?'':'','text',{req:1,attr:'autocomplete="username" autocapitalize="none"'})}${F('Senha','p','','password',{req:1,attr:`autocomplete="${first?'new-password':'current-password'}"`})}${first?F('Repita a senha','p2','','password',{req:1,attr:'autocomplete="new-password"'}):''}
 <div class="err" id="lerr" role="alert"></div><button class="btn" style="width:100%;margin-top:6px">${first?'Criar acesso e entrar':'Entrar'}</button>
 ${first?'':'<p class="small muted" style="margin-bottom:0">Esqueceu a senha? Peça para um administrador redefinir em Equipe e auditoria.</p>'}</form></div></div></div>`;
 $('#f_u')?.focus();
 $('#loginf').onsubmit=async e=>{e.preventDefault();const f=e.target,err=$('#lerr'),u=f.u.value.trim().toLowerCase(),pw=f.p.value;err.textContent='';
  if(S.lockUntil&&Date.now()<S.lockUntil){err.textContent='Muitas tentativas. Espere alguns segundos.';return}
  if(!u||!pw){err.textContent='Preencha usuário e senha.';return}
  const bt=$('#loginf button');bt.disabled=true;bt.textContent='Conferindo…';const done=()=>{bt.disabled=false;bt.textContent=first?'Criar acesso e entrar':'Entrar'};
  try{if(first){const r=pwRule(pw);if(r){err.textContent=r;return}if(pw!==f.p2.value){err.textContent='As senhas não são iguais.';return}if(!/^[a-z0-9._-]{3,30}$/.test(u)){err.textContent='Usuário: 3 a 30 letras, números, ponto, traço.';return}
    await S.db.doc('cred/'+S.uid).set(await newCred(u,pw));audit('criou acesso','cred',S.uid,null,{user:u})}
   else{const ok=u===cred.user&&await hashPw(pw,cred.salt,cred.it||150000)===cred.hash;if(!ok){S.fails=(S.fails||0)+1;if(S.fails>=5){S.lockUntil=Date.now()+30000;S.fails=0}err.textContent='Usuário ou senha incorretos.';audit('falhou login','cred',S.uid,null,{tentativa:now()});return}}
   S.fails=0;setUnlocked(true);decide()}catch(x){err.textContent='Não foi possível entrar agora. Tente de novo.'}finally{if(document.contains(bt))done()}}}
function novidades(c,prev){if(c==='pedidosacesso'&&S.admin){const nv=S.d.pedidosacesso.filter(x=>!prev.has(x.id));if(nv.length){loadNames();notify('Pedido de acesso','Alguém quer entrar na central','equipe')}}if(c==='chat')L('chat').forEach(m=>{if(!prev.has(m.id)&&m.uid!==S.uid&&m.em>S.seenBoot&&!(S.route==='chat'&&!document.hidden))notify('💬 '+nm(m.uid),m.t,'chat')});
 if(c==='materiais'&&(can('estoque')||can('producao')||can('produtos')))L('materiais').forEach(m=>{const o=prev.get(m.id);if(o&&m.tipo==='filamento'&&num(o.estoque)>=LIM_FIL&&num(m.estoque)<LIM_FIL)notify('Filamento acabando',`${matLabel(m)}: só ${n2(m.estoque)} g`,'estoque')})}
async function init(){if(window.HOSTED_READY)await window.HOSTED_READY;if(!window.claude?.use){gate('off');return}
 const slow=setTimeout(()=>{if(!S.boot)gate('slow')},10000);
 const[db,user,assets,dl]=await Promise.all(['db','user','assets','downloads'].map(n=>claude.use(n).catch(()=>null)));
 if(!db){clearTimeout(slow);gate('off');return}
 S.db=db;S.user=user;S.assets=assets;S.dl=dl;S.uid=user?await user.id():null;if(!S.uid){clearTimeout(slow);gate('off');return}
 S.owner=!!(await user.isOwner?.().catch(()=>false));S.admin=S.owner||!!(await user.canEdit?.().catch(()=>false));
 let first=true;
 COLS.forEach(c=>{let q=db.collection(c);if(c==='movs')q=q.orderBy('em','desc').limit(800);if(c==='chat')q=q.orderBy('em','desc').limit(300);
  q.onSnapshot(s=>{const prev=S.ix[c];S.d[c]=s.docs.map(d=>({id:d.id,...d.data()}));idx(c);if(S.boot&&S.seenBoot)novidades(c,prev);S.ready.add(c);if(c==='membros'){if(!s.metadata.fromCache||s.size){clearTimeout(slow);decide()}}else if(c==='pedidosacesso'){if(S.boot)schedule();else if(!S.me&&S.d.pedidosacesso.some(x=>x.id===S.uid)&&!S.pediu){S.pediu=true;decide()}}else if(c==='acessos'&&S.boot)schedule();else schedule()},e=>{S.ready.add(c);if(c==='membros'){clearTimeout(slow);if(e.code==='revoked')gate('off');else decide()}})})}
init().catch(e=>{console.error(e);gate('off')});
}
